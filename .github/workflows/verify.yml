name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

defaults:
  run:
    working-directory: qiqstr_flutter

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify Rust, Dart, native bridge and widgets
        run: ./tool/verify.sh
      - name: Build iOS simulator application
        run: flutter build ios --simulator --debug --no-pub
      - name: Build unsigned iOS device release
        run: flutter build ios --release --no-codesign
  security:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
      - name: Resolve locked Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit app and Breez native dependencies
        run: ./tool/audit_dependencies.sh
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Temurin Java 17.0.20.1+1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
          cache: gradle
          cache-dependency-path: |
            qiqstr_flutter/android/**/*.gradle.kts
            qiqstr_flutter/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK 36 and NDK 28.2.13676358
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Install Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Install Rust 1.96.0 with Android ARM64 target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android
      - name: Resolve locked Flutter and Rust packages
        run: |
          flutter pub get --enforce-lockfile
          cargo fetch --locked --manifest-path rust/Cargo.toml --target aarch64-linux-android
      - name: Build unsigned Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify 16 KB APK and native library alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
          python3 tool/check_android_alignment.py build/app/outputs/flutter-apk/app-release.apk --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Verify dependency lockfiles are unchanged
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
