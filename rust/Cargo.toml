[package]
name = "qiqstr_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]
name = "qiqstr_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli", "tokio"] }
thiserror = "2"
once_cell = "1"
nostr = { version = "0.44.8", default-features = false, features = ["std", "nip04", "nip06", "nip44", "nip47", "nip49", "nip59"] }
nostr-sdk = { version = "0.44", default-features = false, features = ["nip06", "nip44", "nip59"] }
nostr-database = "0.44"
nostr-lmdb = "0.44"
bip39 = { version = "2", features = ["rand"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
hex = "0.4"
futures = "0.3"
aes-gcm = "0.10"
aes = "0.8"
typenum = "1.17"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
cdk = { version = "0.16", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.16", default-features = false, features = ["wallet"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
